apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nuage-home

resources:
  - ../../base
  - ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: nuage-home-config
    literals:
      - PORT=8787
      - LITELLM_BASE_URL=http://litellm.litellm.svc.cluster.local:4000
      - GEMINI_LIVE_BASE_URL=http://gemini-live-proxy.litellm.svc.cluster.local:8080
      - LITELLM_API_KEY=dummy
      - LITELLM_MODEL=auto
      - LITELLM_SUMMARY_MODEL=sakura/auto
      - BWPROXY_URL=http://bare-web-proxy-service.bare-web-proxy.svc.cluster.local
      - GEMINI_LIVE_MODEL=models/gemini-3.8-live
